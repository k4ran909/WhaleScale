syntax = "proto3";

package whalescale.v1;

import "google/protobuf/timestamp.proto";
import "whalescale/v1/control.proto";

option go_package = "github.com/k4ran909/whalescale/gen/whalescale/v1;whalescalev1";

// AdminService manages the network. Callers authenticate with an API key
// ("Authorization: Bearer wsapi-...") or a web console session cookie.
service AdminService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);

  rpc ListPreAuthKeys(ListPreAuthKeysRequest) returns (ListPreAuthKeysResponse);
  rpc CreatePreAuthKey(CreatePreAuthKeyRequest) returns (CreatePreAuthKeyResponse);
  rpc ExpirePreAuthKey(ExpirePreAuthKeyRequest) returns (ExpirePreAuthKeyResponse);

  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  // CheckPolicy validates a policy without applying it.
  rpc CheckPolicy(CheckPolicyRequest) returns (CheckPolicyResponse);
  rpc SetPolicy(SetPolicyRequest) returns (SetPolicyResponse);
  // ExplainAccess says whether src may open connections to dst:port and why.
  rpc ExplainAccess(ExplainAccessRequest) returns (ExplainAccessResponse);

  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc SetRouteApproved(SetRouteApprovedRequest) returns (SetRouteApprovedResponse);

  // GetTopology returns the paths each online node reports to its peers.
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);

  rpc ListPeerRelays(ListPeerRelaysRequest) returns (ListPeerRelaysResponse);
  rpc SetPeerRelayApproved(SetPeerRelayApprovedRequest) returns (SetPeerRelayApprovedResponse);

  rpc ListExposures(ListExposuresRequest) returns (ListExposuresResponse);
  rpc SetExposureApproved(SetExposureApprovedRequest) returns (SetExposureApprovedResponse);

  rpc QueryFlows(QueryFlowsRequest) returns (QueryFlowsResponse);

  rpc ListRecordings(ListRecordingsRequest) returns (ListRecordingsResponse);
  rpc GetRecording(GetRecordingRequest) returns (GetRecordingResponse);

  // The audit log of admin and security-relevant actions, newest first.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);

  // Network lock. The server stores and relays what admins sign on their
  // own machines; it holds no lock keys and can't sign anything itself.
  rpc GetLock(GetLockRequest) returns (GetLockResponse);
  rpc UpdateLock(UpdateLockRequest) returns (UpdateLockResponse);
  rpc SignNodes(SignNodesRequest) returns (SignNodesResponse);

  // Temporary access requests: list, approve or deny, revoke.
  rpc ListAccessRequests(ListAccessRequestsRequest) returns (ListAccessRequestsResponse);
  rpc DecideAccess(DecideAccessRequest) returns (DecideAccessResponse);
  rpc RevokeAccess(RevokeAccessRequest) returns (RevokeAccessResponse);

  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ExpireAPIKey(ExpireAPIKeyRequest) returns (ExpireAPIKeyResponse);
}

message WhoAmIRequest {}
message WhoAmIResponse {
  // "api-key" or "oidc".
  string method = 1;
  string identity = 2;
  bool oidc_enabled = 3;
  // "admin", or "read" for a read-only API key.
  string scope = 4;
}

message User {
  uint64 id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  uint32 node_count = 5;
  // From the policy's device_limits; unset means no limit.
  optional uint32 device_limit = 6;
}

message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }
message CreateUserRequest { string name = 1; }
message CreateUserResponse { User user = 1; }
message DeleteUserRequest { string name = 1; }
message DeleteUserResponse {}

message ListNodesRequest { string user = 1; }
message ListNodesResponse { repeated Node nodes = 1; }
message DeleteNodeRequest { uint64 id = 1; }
message DeleteNodeResponse {}

message PreAuthKey {
  uint64 id = 1;
  string prefix = 2;
  string user = 3;
  bool reusable = 4;
  bool ephemeral = 5;
  bool used = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  bool valid = 9;
}

message ListPreAuthKeysRequest {}
message ListPreAuthKeysResponse { repeated PreAuthKey keys = 1; }
message CreatePreAuthKeyRequest {
  string user = 1;
  bool reusable = 2;
  bool ephemeral = 3;
  // Validity in seconds; 0 means 24 hours.
  uint64 expiration_seconds = 4;
}
message CreatePreAuthKeyResponse {
  PreAuthKey key = 1;
  // The secret, shown only once.
  string secret = 2;
}
message ExpirePreAuthKeyRequest { string prefix = 1; }
message ExpirePreAuthKeyResponse {}

message GetPolicyRequest {}
message GetPolicyResponse {
  string policy = 1;
  // "default" (allow all), "database", "file" or "url" (synced from Git).
  string source = 2;
  // False when the policy comes from a file or a URL.
  bool editable = 3;
  // For "url": where it syncs from and how the last sync went.
  string sync_url = 4;
  google.protobuf.Timestamp last_sync = 5;
  string revision = 6;
  string sync_error = 7;
}
message CheckPolicyRequest { string policy = 1; }
message CheckPolicyResponse {
  repeated string errors = 1;
  repeated string warnings = 2;
}
message SetPolicyRequest { string policy = 1; }
message SetPolicyResponse { repeated string warnings = 1; }

message Route {
  uint64 node_id = 1;
  string node_name = 2;
  string prefix = 3;
  bool approved = 4;
  // True for 0.0.0.0/0 and ::/0.
  bool exit_node = 5;
}
message ListRoutesRequest {}
message ListRoutesResponse { repeated Route routes = 1; }
message SetRouteApprovedRequest {
  uint64 node_id = 1;
  string prefix = 2;
  bool approved = 3;
}
message SetRouteApprovedResponse {}

message GetTopologyRequest {}
message GetTopologyResponse { repeated PathReport paths = 1; }

message APIKey {
  uint64 id = 1;
  string prefix = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp last_used = 5;
  bool valid = 6;
  // "admin" or "read".
  string scope = 7;
}
message ListAPIKeysRequest {}
message ListAPIKeysResponse { repeated APIKey keys = 1; }
message CreateAPIKeyRequest {
  uint64 expiration_seconds = 1;
  // "admin" (the default) or "read": a key that can look but not change
  // anything.
  string scope = 2;
}
message CreateAPIKeyResponse {
  APIKey key = 1;
  string secret = 2;
}
message ExpireAPIKeyRequest { string prefix = 1; }
message ExpireAPIKeyResponse {}

message AdminExposure {
  uint64 node_id = 1;
  string node_name = 2;
  string name = 3;
  uint32 port = 4;
  bool approved = 5;
  string url = 6;
  // True while the node holds a gateway tunnel.
  bool connected = 7;
}
message ListExposuresRequest {}
message ListExposuresResponse {
  repeated AdminExposure exposures = 1;
  // Empty when the gateway is not configured.
  string gateway_domain = 2;
}
message SetExposureApprovedRequest {
  uint64 node_id = 1;
  string name = 2;
  bool approved = 3;
}
message SetExposureApprovedResponse {}

message ExplainAccessRequest {
  // A user, node:NAME or IP.
  string src = 1;
  // "<user|node:NAME|IP>:<port>".
  string dst = 2;
  // Optional draft policy to evaluate instead of the active one.
  string policy = 3;
}
message ExplainAccessResponse {
  bool allowed = 1;
  repeated string reasons = 2;
}

message AdminPeerRelay {
  uint64 node_id = 1;
  string node_name = 2;
  bool approved = 3;
  bool online = 4;
}
message ListPeerRelaysRequest {}
message ListPeerRelaysResponse { repeated AdminPeerRelay relays = 1; }
message SetPeerRelayApprovedRequest {
  uint64 node_id = 1;
  bool approved = 2;
}
message SetPeerRelayApprovedResponse {}

message Recording {
  uint64 id = 1;
  string node_name = 2;
  string local_user = 3;
  string src_node = 4;
  string src_user = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  uint64 size = 8;
}
message ListRecordingsRequest {}
message ListRecordingsResponse { repeated Recording recordings = 1; }
message GetRecordingRequest { uint64 id = 1; }
message GetRecordingResponse {
  Recording recording = 1;
  bytes data = 2;
}

message GetLockRequest {}
message GetLockResponse {
  repeated LockState chain = 1;
}
message UpdateLockRequest {
  // The next version, signed by a key trusted in the current one.
  LockState state = 1;
}
message UpdateLockResponse {}
message SignNodesRequest {
  repeated SignedNodeKey signatures = 1;
}
message SignedNodeKey {
  string node_key = 1;
  NodeSignature signature = 2;
}
message SignNodesResponse {}

message ListAccessRequestsRequest {
  // Also decided, revoked and expired requests (newest first).
  bool include_closed = 1;
}
message ListAccessRequestsResponse {
  repeated AccessRequest requests = 1;
}
message DecideAccessRequest {
  uint64 id = 1;
  bool approve = 2;
}
message DecideAccessResponse {
  AccessRequest request = 1;
}
message RevokeAccessRequest {
  uint64 id = 1;
}
message RevokeAccessResponse {}

message ListAuditEventsRequest {
  // Only events in the last N seconds; 0 means all.
  uint64 since_seconds = 1;
  // Substring filters on the actor and the action.
  string actor = 2;
  string action = 3;
  // 0 means 200; at most 5000.
  uint32 limit = 4;
  // Also check the whole log's hash chain.
  bool verify = 5;
}
message AuditEvent {
  uint64 id = 1;
  google.protobuf.Timestamp at = 2;
  // "oidc:EMAIL", "api-key:PREFIX", "cli:OSUSER", "user:NAME", "git", ...
  string actor = 3;
  string action = 4;
  // key=value pairs.
  string detail = 5;
}
message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  // Set when verify was asked for.
  AuditVerification verification = 2;
}
message AuditVerification {
  bool ok = 1;
  uint32 checked = 2;
  // Hex SHA-256 of the newest entry. Record it elsewhere now and then:
  // the chain alone can't show that the newest entries were removed.
  string head_hash = 3;
  // First entry that doesn't match, when not ok.
  uint64 broken_at = 4;
}

message QueryFlowsRequest {
  // Only flows reported by this node (name); empty for all.
  string node = 1;
  // Only flows ending in the last N seconds; 0 means one hour.
  uint64 since_seconds = 2;
  bool denied_only = 3;
  // 0 means 200; at most 5000.
  uint32 limit = 4;
}
message AdminFlow {
  string node_name = 1;
  uint32 proto = 2;
  string client = 3;
  string client_name = 4;
  string server = 5;
  string server_name = 6;
  uint32 port = 7;
  bool outbound = 8;
  bool denied = 9;
  google.protobuf.Timestamp start = 10;
  google.protobuf.Timestamp end = 11;
  uint64 bytes_sent = 12;
  uint64 bytes_recv = 13;
  uint64 packets_sent = 14;
  uint64 packets_recv = 15;
}
message QueryFlowsResponse {
  repeated AdminFlow flows = 1;
  // False when the server runs without flow-logs.
  bool enabled = 2;
}
