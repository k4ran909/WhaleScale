syntax = "proto3";

package whalescale.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/k4ran909/whalescale/gen/whalescale/v1;whalescalev1";

// ControlService is the API that agents (wsd) and the ws CLI talk to.
//
// Registration with a pre-auth key returns a node token that authenticates
// every later call as "Authorization: Bearer <node_token>". A Noise handshake
// bound to the machine key replaces the token in a later phase.
service ControlService {
  // Register enrolls a new node. With an auth_key it completes at once.
  // Without one (and with OIDC configured) it returns an auth_url for the
  // user to open; the client then calls WaitRegistration.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // WaitRegistration blocks (up to about a minute) until a browser login
  // started by Register completes. Retry on DEADLINE_EXCEEDED.
  rpc WaitRegistration(WaitRegistrationRequest) returns (WaitRegistrationResponse);
  // UpdateNode reports the agent's current keys, endpoints and host info.
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  // GetNetworkMap returns a one-shot network map.
  rpc GetNetworkMap(GetNetworkMapRequest) returns (GetNetworkMapResponse);
  // StreamNetworkMap sends the full network map on connect and again every
  // time it changes. While the stream is open the node counts as online.
  rpc StreamNetworkMap(StreamNetworkMapRequest) returns (stream StreamNetworkMapResponse);
  // ReportStatus shares the agent's view of its paths, for the console's
  // topology view and server metrics. Kept in memory only.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);
  // UploadRecording stores a finished, recorded SSH session.
  rpc UploadRecording(UploadRecordingRequest) returns (UploadRecordingResponse);
}

message Node {
  uint64 id = 1;
  string name = 2;
  string user = 3;
  // X25519 public key, base64 (std encoding). Long-lived machine identity.
  string machine_key = 4;
  repeated string addresses = 5;
  string os = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_seen = 8;
  bool ephemeral = 9;
  // WireGuard public key, base64. Empty until the agent first reports it.
  string node_key = 10;
  // Public key for authenticated path-discovery messages, base64.
  string disco_key = 11;
  // Candidate UDP endpoints (ip:port) the node can be reached on.
  repeated string endpoints = 12;
  bool online = 13;
  // Fully qualified MagicDNS name, e.g. "laptop.whale.internal".
  string fqdn = 14;
  // Approved subnet routes this node serves (exit routes excluded).
  repeated string routes = 15;
  // Routes the node offers, approved or not.
  repeated string advertised_routes = 16;
  // Approved to act as an exit node.
  bool exit_node = 17;
  // SSH host public key (authorized_keys format), when the node runs SSH.
  string ssh_host_key = 18;
}

message RegisterRequest {
  string auth_key = 1;
  string machine_key = 2;
  string hostname = 3;
  string os = 4;
}

message RegisterResponse {
  Node node = 1;
  // Secret used to authenticate this node. Shown only once.
  string node_token = 2;
  // Set when the user must finish logging in in a browser.
  string auth_url = 3;
  string registration_id = 4;
}

message WaitRegistrationRequest {
  string registration_id = 1;
}

message WaitRegistrationResponse {
  Node node = 1;
  string node_token = 2;
}

message UpdateNodeRequest {
  string node_key = 1;
  string disco_key = 2;
  repeated string endpoints = 3;
  string os = 4;
  // Subnets (and 0.0.0.0/0, ::/0 for an exit node) this node offers.
  // They take effect once an admin approves them.
  repeated string advertised_routes = 5;
  // Local services this node wants published through the gateway. Only
  // name and port are read; they go live once an admin approves them.
  repeated Exposure exposures = 6;
  // Offer this node as a UDP relay for peers that can't connect directly.
  // It takes effect once an admin approves it.
  bool offer_relay = 7;
  // SSH host public key, when this node runs the mesh SSH server.
  string ssh_host_key = 8;
}

// Exposure is a local HTTP service published at https://<name>.<gateway domain>.
message Exposure {
  string name = 1;
  // Port on the node's localhost.
  uint32 port = 2;
  bool approved = 3;
  // Public URL, set by the server.
  string url = 4;
  // Why the exposure isn't live, e.g. "name taken by another machine".
  string problem = 5;
}

message UpdateNodeResponse {}

message GetNetworkMapRequest {}

message GetNetworkMapResponse {
  Node self = 1;
  repeated Node peers = 2;
}

message StreamNetworkMapRequest {}

message StreamNetworkMapResponse {
  // Empty on keep-alive messages.
  NetworkMap network_map = 1;
  bool keep_alive = 2;
}

message NetworkMap {
  Node self = 1;
  // Only peers this node may talk to (in either direction) under the policy.
  repeated Node peers = 2;
  DNSConfig dns = 3;
  // Relay endpoints, e.g. "wss://ws.example.com/relay".
  repeated string relays = 4;
  // STUN servers as host:port.
  repeated string stun = 5;
  // Inbound packet filter for this node. Empty list means deny all inbound.
  repeated FilterRule packet_filter = 6;
  // Monotonic map version, for logging and debugging.
  uint64 version = 7;
  // This node's exposures and their state.
  repeated Exposure exposures = 8;
  // WebSocket URL of the gateway tunnel; empty when the gateway is off.
  string gateway_url = 9;
  // Approved peer relays this node may use (never itself).
  repeated PeerRelay peer_relays = 10;
  // Set only for an approved relay: the nodes it may serve.
  repeated RelayClient relay_clients = 11;
  // Whether this node offers to relay, and whether that is approved.
  bool relay_offered = 12;
  bool relay_approved = 13;
  // SSH logins this node accepts.
  repeated SSHRule ssh_rules = 14;
  // Report connection activity (flow logs) to the server.
  bool flow_logs = 15;
  // QUIC relay (host:port, UDP) and the SHA-256 of its self-signed
  // certificate, hex. Empty when the server offers WebSocket only.
  string quic_relay = 16;
  string quic_relay_cert_sha256 = 17;
}

// SSHRule lets connections from src_prefixes log in as the listed local
// users ("$user" = the connecting person's mesh user name).
message SSHRule {
  repeated string src_prefixes = 1;
  repeated string users = 2;
  bool record = 3;
}

message UploadRecordingRequest {
  string local_user = 1;
  string src_node = 2;
  string src_user = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  // asciinema v2 (.cast) contents.
  bytes data = 6;
}

message UploadRecordingResponse {}

// PeerRelay is a node that forwards UDP between peers that can't connect
// directly. It shares the node's WireGuard socket and endpoints.
message PeerRelay {
  string name = 1;
  string node_key = 2;
  string disco_key = 3;
  repeated string endpoints = 4;
}

// RelayClient is a node a relay serves; registrations are sealed with the
// disco key, so the relay can check who is registering.
message RelayClient {
  string node_key = 1;
  string disco_key = 2;
}

message DNSConfig {
  // Domain suffix for MagicDNS names, e.g. "whale.internal".
  string suffix = 1;
}

// FilterRule allows traffic from any of src_prefixes to the ports. With
// dst_prefixes empty it covers this node's own addresses; otherwise it
// covers those prefixes (subnets this node routes).
message FilterRule {
  repeated string src_prefixes = 1;
  repeated PortRange ports = 2;
  repeated string dst_prefixes = 3;
}

message PortRange {
  uint32 first = 1;
  uint32 last = 2;
}

message PathReport {
  string from_node = 1;
  string to_node = 2;
  // "direct", "relay" or "none".
  string path = 3;
  string addr = 4;
  double latency_ms = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message ReportStatusRequest {
  repeated PathReport paths = 1;
  // Connection activity since the last report; only when flow logging is on.
  repeated FlowRecord flows = 2;
}

// FlowRecord is one connection's traffic over a reporting window, from the
// reporting node's point of view.
message FlowRecord {
  uint32 proto = 1;
  // The side that opened the connection, and the side it went to.
  string client = 2;
  string server = 3;
  uint32 port = 4;
  // This node opened the connection.
  bool outbound = 5;
  // An inbound attempt the access policy refused.
  bool denied = 6;
  google.protobuf.Timestamp start = 7;
  google.protobuf.Timestamp end = 8;
  uint64 bytes_sent = 9;
  uint64 bytes_recv = 10;
  uint64 packets_sent = 11;
  uint64 packets_recv = 12;
}

message ReportStatusResponse {}
