[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/stun",
    "crates/coordinator",
    "crates/relay",
    "crates/stun-server",
    "crates/agent-core",
    "crates/agent-cli",
    "crates/agent-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["WhaleScale"]
repository = "https://github.com/whalescale/whalescale"

[workspace.dependencies]
# async runtime
tokio = { version = "1.41", features = ["full"] }
# web
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# db
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate", "ipnetwork"] }
# cache / pubsub
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# auth
jsonwebtoken = "9"
# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# errors
anyhow = "1"
thiserror = "2"
# misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
config = "0.14"
dotenvy = "0.15"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio-tungstenite = "0.24"
futures = "0.3"
