# /etc/whalescale/config.yaml — keys are the flags of 'whalescale serve'.
# Local overrides belong in /etc/whalescale/conf.d/*.yaml (applied in name
# order, never touched by upgrades). WHALESCALE_<KEY> env vars and flags
# override both. Check with: whalescale configtest

db: /var/lib/whalescale/whalescale.db
listen: ":443"
public-url: https://ws.example.com
tls-cert: /etc/whalescale/tls/fullchain.pem
tls-key: /etc/whalescale/tls/privkey.pem
# Or let the server get certificates itself (port 443 must be reachable):
# tls-acme: true
# acme-email: you@example.com
# Several servers on different hosts share a PostgreSQL database instead
# of an SQLite file (see "Several servers" in the README):
# db: postgres://whalescale:PASSWORD@db.internal:5432/whalescale?sslmode=require

# Two ports let nodes detect symmetric NAT.
stun-listen: ":3478,:3479"
# QUIC relay (UDP); nodes fall back to the WebSocket relay if it's blocked.
relay-quic-listen: ":3480"
dns-suffix: whale.internal
metrics-listen: "127.0.0.1:9090"

# Flow logs: machines report who talked to whom (off by default).
# flow-logs: true
# flow-log-retention: 168h

# Gateway: machines publish services at <name>.<gateway-domain>.
# Needs a wildcard DNS record *.apps.example.com pointing here.
# gateway-domain: apps.example.com
log-level: info

# Without 'policy' or 'policy-url', the access policy is edited in the console.
# policy: /etc/whalescale/policy.json
# Or follow it in a Git repository (raw file URL on a branch):
# policy-url: https://raw.githubusercontent.com/you/infra/main/whalescale/policy.json
# policy-url-token-file: /etc/whalescale/repo-token
# policy-webhook-secret-file: /etc/whalescale/hook-secret

# Browser login (console and 'ws login' without a key):
# oidc-issuer: https://auth.example.com/application/o/whalescale/
# oidc-client-id: whalescale
# oidc-client-secret-file: /etc/whalescale/oidc-secret
# oidc-admins: [you@example.com]
# oidc-allowed-domains: [example.com]
