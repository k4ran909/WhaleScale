{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "whalescale.fullname" . }}
  labels:
    {{- include "whalescale.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "whalescale.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
