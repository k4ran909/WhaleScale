{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whalescale.fullname" . }}-db
  labels:
    {{- include "whalescale.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
{{- end }}
{{- if and .Values.oidc.issuer .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whalescale.fullname" . }}-oidc
  labels:
    {{- include "whalescale.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.oidc.existingSecretKey }}: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
