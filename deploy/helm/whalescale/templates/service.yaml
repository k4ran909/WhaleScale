apiVersion: v1
kind: Service
metadata:
  name: {{ include "whalescale.fullname" . }}
  labels:
    {{- include "whalescale.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "whalescale.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- if .Values.udp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whalescale.fullname" . }}-udp
  labels:
    {{- include "whalescale.labels" . | nindent 4 }}
  {{- with .Values.udp.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.udp.type }}
  {{- if ne .Values.udp.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.udp.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.udp.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector:
    {{- include "whalescale.selectorLabels" . | nindent 4 }}
  ports:
    - name: stun
      port: 3478
      targetPort: stun
      protocol: UDP
    - name: stun-alt
      port: 3479
      targetPort: stun-alt
      protocol: UDP
    - name: quic
      port: 3480
      targetPort: quic
      protocol: UDP
{{- end }}
