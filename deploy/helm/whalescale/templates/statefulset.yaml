apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "whalescale.fullname" . }}
  labels:
    {{- include "whalescale.labels" . | nindent 4 }}
spec:
  # One server per release: for failover, install another release with its
  # own publicURL against the same PostgreSQL database.
  replicas: 1
  serviceName: {{ include "whalescale.fullname" . }}
  selector:
    matchLabels:
      {{- include "whalescale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "whalescale.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whalescale
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: WHALESCALE_CONFIG
              value: /etc/whalescale/config.yaml
            - name: WHALESCALE_RECORDINGS_DIR
              value: /var/lib/whalescale/recordings
            {{- if include "whalescale.usesPostgres" . }}
            - name: WHALESCALE_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "whalescale.dbSecret" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            {{- if and .Values.oidc.issuer (or .Values.oidc.clientSecret .Values.oidc.existingSecret) }}
            - name: WHALESCALE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "whalescale.oidcSecret" . }}
                  key: {{ .Values.oidc.existingSecretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: stun-alt
              containerPort: 3479
              protocol: UDP
            - name: quic
              containerPort: 3480
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/whalescale
              readOnly: true
            - name: data
              mountPath: /var/lib/whalescale
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "whalescale.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.persistence.accessMode }}]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
