name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check generated code is current
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.57.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.18.1
          buf lint
          buf generate
          git diff --exit-code -- gen/
      - run: go vet ./...
      - run: go test -race -timeout 5m ./...
      - name: Tests on PostgreSQL
        env:
          WHALESCALE_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -timeout 5m ./internal/store/... ./internal/control/... ./internal/server/... ./internal/engine/...

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the embedded console build is current
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- dist/ || { echo "web/dist is stale: run 'make web' and commit"; exit 1; }

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Lint and render the chart
        run: |
          helm lint --strict deploy/helm/whalescale --set publicURL=https://ws.example.com
          helm template ws deploy/helm/whalescale --set publicURL=https://ws.example.com \
            --set database.url=postgres://ws@db/ws --set ingress.enabled=true \
            --set oidc.issuer=https://auth.example.com --set oidc.clientID=ws --set oidc.clientSecret=x > /dev/null
          ! helm template ws deploy/helm/whalescale > /dev/null 2>&1 # publicURL is required

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          for cmd in whalescale ws wsd; do
            go build -trimpath -ldflags "-s -w -X github.com/k4ran909/whalescale/internal/version.Commit=${GITHUB_SHA::7}" \
              -o dist/$cmd-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/$cmd
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
