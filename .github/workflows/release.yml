name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          v="${VERSION#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            out="build/${os}_${arch}"
            mkdir -p "$out"
            for cmd in whalescale ws wsd; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/k4ran909/whalescale/internal/version.Version=$VERSION -X github.com/k4ran909/whalescale/internal/version.Commit=${GITHUB_SHA::7}" \
                -o "$out/$cmd$ext" ./cmd/$cmd
            done
            cp README.md "$out/"
            name="whalescale_${v}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$out" && zip -q "../../dist/$name.zip" ./*)
            else
              tar -czf "dist/$name.tar.gz" -C "$out" .
            fi
          done
          (cd dist && sha256sum ./* | sed 's# \./# #' > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/whalescale
          # v1.2.3 -> 1.2.3, 1.2 and latest (the Helm chart's appVersion form)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
