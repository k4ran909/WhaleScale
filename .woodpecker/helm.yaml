# Lint and render the Helm chart.

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  - name: lint and render the chart
    image: alpine/helm:3.22.1
    commands:
      - helm lint --strict deploy/helm/whalescale --set publicURL=https://ws.example.com
      - >-
        helm template ws deploy/helm/whalescale --set publicURL=https://ws.example.com
        --set database.url=postgres://ws@db/ws --set ingress.enabled=true
        --set oidc.issuer=https://auth.example.com --set oidc.clientID=ws --set oidc.clientSecret=x > /dev/null
      - "! helm template ws deploy/helm/whalescale > /dev/null 2>&1 # publicURL is required"
