# On a v* tag: release archives on GitHub Releases and multi-arch images on
# ghcr.io. Both use the 'github_token' secret: a classic personal access
# token with the 'repo' and 'write:packages' scopes (see docs/woodpecker.md).

when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: build archives
    image: golang:1.27.2
    commands:
      - apt-get update -qq && apt-get install -y -qq zip > /dev/null
      - sh scripts/ci/release-archives.sh "${CI_COMMIT_TAG}"

  - name: publish release
    image: alpine:3.22
    depends_on: [build archives]
    environment:
      GH_TOKEN:
        from_secret: github_token
      GH_REPO: ${CI_REPO}
    commands:
      - apk add --no-cache github-cli > /dev/null
      - gh release create "${CI_COMMIT_TAG}" dist/* --generate-notes --verify-tag

  - name: image
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    depends_on: []
    settings:
      registry: ghcr.io
      repo: ghcr.io/k4ran909/whalescale
      platforms: linux/amd64,linux/arm64
      # v1.2.3 -> 1.2.3, 1.2, 1 and latest
      auto_tag: true
      build_args:
        VERSION: ${CI_COMMIT_TAG}
        COMMIT: ${CI_COMMIT_SHA}
      username: k4ran909
      password:
        from_secret: github_token
