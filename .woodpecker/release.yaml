# On a v* tag: release archives, packages and the Android APK on GitHub
# Releases, and multi-arch images on ghcr.io. Both use the 'github_token' secret: a classic personal access
# token with the 'repo' and 'write:packages' scopes (see docs/development/ci.md).

when:
  - event: tag
    ref: refs/tags/v*

steps:
  # The signed Android APK, released as whalescale-android.apk. It goes
  # first so the checksums cover it. Google ships the NDK and aapt2 only for
  # x86_64 Linux, so this is the amd64 golang image (same digest as
  # android.yaml) under QEMU, which the arm64 agent's Docker host must have
  # registered (docs/development/ci.md). Until it does, this step fails and
  # the release goes out without the APK: release-archives.sh then leaves the
  # Android row out of the notes. The two keystore secrets must exist,
  # though: Woodpecker refuses to start a pipeline that names a missing
  # secret, even for a step allowed to fail.
  - name: android apk
    image: golang:1.27.3@sha256:a5406f41680f17b4aa0b49de641e00f116215f5c8829d548d29cb44c4f85aa4f
    failure: ignore
    volumes:
      - woodpecker-go-mod:/go/pkg/mod
      - woodpecker-go-build:/root/.cache/go-build
      - woodpecker-android:/opt/android-tools
      - woodpecker-gradle:/root/.gradle
    environment:
      ANDROID_KEYSTORE:
        from_secret: android_keystore
      WS_ANDROID_KEYSTORE_PASSWORD:
        from_secret: android_keystore_password
    commands:
      - sh scripts/ci/android-release.sh "${CI_COMMIT_TAG}"

  - name: build archives
    image: golang:1.27.3
    depends_on: [android apk]
    commands:
      - sh scripts/ci/retry.sh apt-get update -qq
      - sh scripts/ci/retry.sh apt-get install -y -qq zip unzip nsis minisign rpm
      - sh scripts/ci/release-archives.sh "${CI_COMMIT_TAG}"
    environment:
      # The release key's private half (internal/release/tool keygen). The
      # tray's updater refuses releases without its signature.
      RELEASE_SIGNING_KEY:
        from_secret: release_signing_key

  - name: publish release
    image: alpine:3.22
    depends_on: [build archives]
    environment:
      GH_TOKEN:
        from_secret: github_token
      GH_REPO: ${CI_REPO}
    commands:
      - sh scripts/ci/retry.sh apk add --no-cache github-cli
      # The "which file do I need?" guide, then GitHub's list of changes.
      # (build/release-notes.md: packaging/release-notes.md, without the
      # Android row when the APK couldn't be built.)
      - gh release create "${CI_COMMIT_TAG}" dist/* --notes-file build/release-notes.md --generate-notes --verify-tag

  - name: image
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    depends_on: []
    settings:
      registry: ghcr.io
      repo: ghcr.io/k4ran909/whalescale
      platforms: linux/amd64,linux/arm64
      # v1.2.3 -> 1.2.3, 1.2, 1 and latest
      auto_tag: true
      build_args:
        VERSION: ${CI_COMMIT_TAG}
        COMMIT: ${CI_COMMIT_SHA}
      username: k4ran909
      password:
        from_secret: github_token
