# The Android app: the Go core built with gomobile, then a debug APK with
# Gradle.
#
# JDK, Android SDK and NDK (about 3 GB) are installed once into the
# 'woodpecker-android' volume, and Gradle's downloads kept in
# 'woodpecker-gradle'. A release APK needs a signing key and isn't built
# here yet (see docs/guides/android.md).

# Manual only: under emulation on the arm64 agent (see below) a build takes
# well over an hour, too long for every push. Start it from Woodpecker's
# "Run pipeline"; releases build the signed APK anyway (release.yaml).
when:
  - event: manual

steps:
  - name: debug apk
    # Google ships the NDK and Gradle's aapt2 only for x86_64 Linux, and the
    # agent is arm64, so this is golang:1.27.4's amd64 image, pinned by
    # digest, running under QEMU emulation. The agent's Docker host must have
    # it registered (docs/development/ci.md); BuildKit's own emulation, which
    # builds the amd64 release image, doesn't cover normal steps. It's slow;
    # keep the digest in step with the Go
    # version in go.mod.
    image: golang:1.27.4@sha256:2cd7e1ebf475c6208122d2b9cefc638d98fcc8dfd8554c8872c9dd0c21f4ac61
    volumes:
      - woodpecker-go-mod:/go/pkg/mod
      - woodpecker-go-build:/root/.cache/go-build
      - woodpecker-android:/opt/android-tools
      - woodpecker-gradle:/root/.gradle
    commands:
      - sh scripts/ci/retry.sh apt-get update -qq
      - sh scripts/ci/retry.sh apt-get install -y -qq unzip
      - sh scripts/ci/android-sdk.sh
      - sh scripts/ci/android-build.sh debug
