# The Linux packages must build, install, upgrade and uninstall: the .deb on
# Debian and the .rpm on Fedora. (The release pipeline builds and publishes
# them for amd64 and arm64.) There is no systemd in these containers, so the
# install scripts skip the service; it's tested in docs/development/real-world-test.md.

when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  - name: packages build
    image: golang:1.27.4
    volumes:
      - woodpecker-go-mod:/go/pkg/mod
      - woodpecker-go-build:/root/.cache/go-build
    environment:
      CGO_ENABLED: "0"
      GOOS: linux
    # For the agent's own architecture (amd64 or arm64), so the next steps
    # can install them.
    commands:
      - sh scripts/ci/retry.sh apt-get update -qq
      - sh scripts/ci/retry.sh apt-get install -y -qq rpm
      - mkdir -p build/bin
      - for c in whalescale ws wsd; do go build -trimpath -ldflags "-X github.com/k4ran909/whalescale/internal/version.Version=v0.0.0-ci" -o build/bin/$c ./cmd/$c; done
      - sh scripts/ci/linux-packages.sh v0.0.0-ci "$(go env GOARCH)" build/bin build/packages

  - name: deb installs on debian
    image: debian:13
    depends_on: [packages build]
    commands:
      - apt-get install -y "./build/packages/whalescale-$(dpkg --print-architecture).deb" "./build/packages/whalescale-server-$(dpkg --print-architecture).deb"
      - ws version && wsd version && whalescale version
      - test -d /var/lib/whalescale && getent passwd whalescale && test -d /etc/whalescale/conf.d
      - apt-get install -y --reinstall "./build/packages/whalescale-$(dpkg --print-architecture).deb"
      - apt-get remove -y whalescale whalescale-server
      - test ! -e /usr/bin/ws && test ! -e /usr/bin/whalescale

  - name: rpm installs on fedora
    image: fedora:42
    depends_on: [packages build]
    commands:
      - rpm -i "build/packages/whalescale-$(uname -m).rpm" "build/packages/whalescale-server-$(uname -m).rpm"
      - ws version && wsd version && whalescale version
      - test -d /var/lib/whalescale && getent passwd whalescale && test -d /etc/whalescale/conf.d
      - rpm -U --replacepkgs "build/packages/whalescale-$(uname -m).rpm"
      - rpm -e whalescale whalescale-server
      - test ! -e /usr/bin/ws && test ! -e /usr/bin/whalescale
